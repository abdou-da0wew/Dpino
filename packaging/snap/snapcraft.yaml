name: dpino
version: '0.1.0'
summary: Rust-powered package metadata extractor + installer + browser
description: |
  dpino scans directories for Debian packages (.deb), AppImages (.AppImage), and
  AppDir packages. It can extract metadata, generate Freedesktop-compliant desktop
  entries, install them to XDG directories, and provide an interactive TUI browser
  for package management.
  
  Features:
  - Scan directories for packages
  - Extract package metadata
  - Generate and install desktop entries
  - Interactive TUI browser
  - Support for .deb, .AppImage, and AppDir formats

confinement: strict
grade: stable
base: core22

apps:
  dpino:
    command: dpino
    plugs:
      - home
      - removable-media
      - network

parts:
  dpino:
    plugin: dump
    source: ../../
    organize:
      target/release/dpino: bin/dpino
      final/dpino/usr/share/applications/dpino.desktop: share/applications/dpino.desktop
      final/dpino/usr/share/icons/hicolor/16x16/apps/dpino.png: share/icons/hicolor/16x16/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/22x22/apps/dpino.png: share/icons/hicolor/22x22/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/24x24/apps/dpino.png: share/icons/hicolor/24x24/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/32x32/apps/dpino.png: share/icons/hicolor/32x32/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/48x48/apps/dpino.png: share/icons/hicolor/48x48/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/64x64/apps/dpino.png: share/icons/hicolor/64x64/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/128x128/apps/dpino.png: share/icons/hicolor/128x128/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/256x256/apps/dpino.png: share/icons/hicolor/256x256/apps/dpino.png
      final/dpino/usr/share/icons/hicolor/512x512/apps/dpino.png: share/icons/hicolor/512x512/apps/dpino.png
    stage:
      - bin/dpino
      - share/applications/dpino.desktop
      - share/icons/hicolor/*/apps/dpino.png
    prime:
      - bin/dpino
      - share/applications/dpino.desktop
      - share/icons/hicolor/*/apps/dpino.png

